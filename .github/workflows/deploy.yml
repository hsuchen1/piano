# Verifies every push and pull request, and deploys main to GitHub Pages.
name: Verify and deploy

on:
  push:
    branches: ['main']
  # Run the checks on pull requests too, so problems surface before they reach main.
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Deployment used to be the only job, and it ran nothing but `npm run build`.
  # Lint and test failures could therefore ship straight to production. These
  # checks now gate the deploy job below.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 18 reached end of life in April 2025 and no longer gets security
          # patches. 22 is the active LTS and matches local development.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit production dependencies
        # Advisory only. Dev-only findings in the build toolchain should not block a
        # deploy, but a vulnerability reachable from shipped code is worth seeing.
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  deploy:
    # Only main gets deployed; pull requests stop after verify.
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run build` also runs the type check, so a type error cannot be
      # published even if this job is run on its own.
      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
